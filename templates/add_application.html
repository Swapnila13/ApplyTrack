{% extends "base.html" %}
{% block title %}Add application | Smart Job Tracker{% endblock %}
{% block content %}<section class="form-page"><a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a><div class="form-heading"><p class="eyebrow">NEW OPPORTUNITY</p><h1>Add an application</h1><p class="muted">Save the key details so you can follow up at the right time.</p></div>
<form class="application-form panel" method="post"><div class="form-grid"><label>Company name <span class="required">*</span><input name="company_name" required maxlength="150" value="{{ application.get('company_name', '') }}" placeholder="e.g. Acme Technologies"></label><label>Job role <span class="required">*</span><input name="job_role" required maxlength="150" value="{{ application.get('job_role', '') }}" placeholder="e.g. Software Engineer"></label><label>Application date <span class="required">*</span><input type="date" name="application_date" required value="{{ application.get('application_date', '') }}"></label><label>Status <span class="required">*</span><select name="status" required>{% for status in statuses %}<option value="{{ status }}" {% if application.get('status', 'Applied') == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>Follow-up date <span class="optional">Optional</span><input type="date" name="follow_up_date" value="{{ application.get('follow_up_date') or '' }}"><small>Active applications are classified as overdue, due today, or upcoming.</small></label><label>Job posting URL <span class="optional">Optional</span><input type="url" name="job_url" value="{{ application.get('job_url', '') }}" placeholder="https://..."></label><label class="full-width">Notes <span class="optional">Optional</span><textarea name="notes" rows="4" maxlength="3000" placeholder="Recruiter contact, assessment details, or next steps...">{{ application.get('notes', '') }}</textarea></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="button primary" type="submit">Save application</button></div></form></section>{% endblock %}
