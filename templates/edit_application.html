{% extends "base.html" %}
{% block title %}Edit application | Smart Job Tracker{% endblock %}
{% block content %}<section class="form-page"><a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a><div class="form-heading"><p class="eyebrow">UPDATE OPPORTUNITY</p><h1>Edit application</h1><p class="muted">Update the status or change any saved details.</p></div>
<form class="application-form panel" method="post"><div class="form-grid"><label>Company name <span class="required">*</span><input name="company_name" required maxlength="150" value="{{ application.get('company_name', '') }}"></label><label>Job role <span class="required">*</span><input name="job_role" required maxlength="150" value="{{ application.get('job_role', '') }}"></label><label>Application date <span class="required">*</span><input type="date" name="application_date" required value="{{ application.get('application_date', '') }}"></label><label>Status <span class="required">*</span><select name="status" required>{% for status in statuses %}<option value="{{ status }}" {% if application.get('status') == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>Follow-up date <span class="optional">Optional</span><input type="date" name="follow_up_date" value="{{ application.get('follow_up_date') or '' }}"></label><label>Job posting URL <span class="optional">Optional</span><input type="url" name="job_url" value="{{ application.get('job_url', '') }}" placeholder="https://..."></label><label class="full-width">Notes <span class="optional">Optional</span><textarea name="notes" rows="4" maxlength="3000">{{ application.get('notes', '') }}</textarea></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="button primary" type="submit">Save changes</button></div></form></section>{% endblock %}
